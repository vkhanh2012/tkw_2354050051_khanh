<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dữ liệu giao dịch - HRManager</title><link rel="stylesheet" href="./dist/output.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){const saved=localStorage.getItem("theme");const dark=saved?saved==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",dark);})();</script>
</head>
<body class="flex flex-col gap-0"><header class="border-b border-line bg-surface dark:border-line-invert dark:bg-surface-dark"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-10 lg:px-20"><a href="index.html" class="font-display text-2xl font-bold text-brand-600">HRManager</a><div class="flex items-center gap-3"><a href="records.html" class="text-sm font-semibold text-brand-600">Dữ liệu</a><button type="button" class="btn btn-secondary" data-theme-toggle aria-label="Bật chế độ tối">Theme</button><a href="contact.html" class="btn btn-primary">Liên hệ</a></div></nav></header>
<main class="section flex flex-col gap-8" data-records-app><header class="flex flex-col gap-3"><p class="eyebrow">Kho giao dịch</p><h1 class="text-4xl sm:text-5xl">Theo dõi nông sản</h1><p class="max-w-2xl text-base leading-relaxed text-muted dark:text-muted-invert">Tra cứu, sắp xếp và cập nhật các phiếu cân trong một bảng dữ liệu thống nhất.</p></header>
<section aria-label="Bộ lọc dữ liệu" class="card grid gap-4 md:grid-cols-2 xl:grid-cols-4"><label class="flex flex-col gap-2 md:col-span-2 xl:col-span-1"><span class="field-label">Tìm thương lái</span><input class="field-input" data-query type="search" placeholder="Ví dụ: Chú Bảy" autocomplete="off"></label><label class="flex flex-col gap-2"><span class="field-label">Nhóm hàng</span><select class="field-input" data-category><option value="all">Tất cả nhóm hàng</option></select></label><label class="flex flex-col gap-2"><span class="field-label">Trạng thái</span><select class="field-input" data-status><option value="all">Tất cả trạng thái</option><option value="da-chot">Đã chốt</option><option value="cho-duyet">Chờ duyệt</option><option value="tu-choi">Từ chối</option></select></label><label class="flex flex-col gap-2"><span class="field-label">Sắp xếp</span><select class="field-input" data-sort><option value="date-desc">Ngày mới nhất</option><option value="date-asc">Ngày cũ nhất</option><option value="amount-desc">Giá trị cao nhất</option><option value="amount-asc">Giá trị thấp nhất</option><option value="weight-desc">Khối lượng lớn nhất</option></select></label></section>
<section aria-labelledby="records-title" class="flex flex-col gap-4"><div class="flex flex-wrap items-center justify-between gap-3"><h2 id="records-title" class="text-2xl">Danh sách phiếu cân</h2><button class="btn btn-secondary" type="button" data-restore>Khôi phục dữ liệu mẫu</button></div><div data-status-message aria-live="polite"></div><div class="overflow-x-auto rounded-card border border-line dark:border-line-invert"><table class="records-table min-w-full text-left text-sm"><thead><tr><th>Mã phiếu</th><th>Thương lái</th><th>Nhóm hàng</th><th>Khối lượng</th><th>Giá trị</th><th>Ngày</th><th>Trạng thái</th><th><span class="sr-only">Thao tác</span></th></tr></thead><tbody data-records-list></tbody></table></div></section>
<section aria-labelledby="add-record-title" class="card"><h2 id="add-record-title" class="mb-5 text-2xl">Thêm phiếu cân</h2><form class="grid gap-4 md:grid-cols-2 xl:grid-cols-4" data-record-form><label class="flex flex-col gap-2"><span class="field-label">Mã phiếu</span><input class="field-input" name="id" required placeholder="PC-2608-001"></label><label class="flex flex-col gap-2"><span class="field-label">Tên thương lái</span><input class="field-input" name="trader" required placeholder="Tên người bán"></label><label class="flex flex-col gap-2"><span class="field-label">Nhóm hàng</span><input class="field-input" name="category" required placeholder="Xoài"></label><label class="flex flex-col gap-2"><span class="field-label">Khối lượng (kg)</span><input class="field-input" name="weight" type="number" min="1" required></label><label class="flex flex-col gap-2"><span class="field-label">Giá trị (VNĐ)</span><input class="field-input" name="amount" type="number" min="1" required></label><label class="flex flex-col gap-2"><span class="field-label">Ngày</span><input class="field-input" name="date" type="date" required></label><label class="flex flex-col gap-2"><span class="field-label">Trạng thái</span><select class="field-input" name="status"><option value="cho-duyet">Chờ duyệt</option><option value="da-chot">Đã chốt</option><option value="tu-choi">Từ chối</option></select></label><div class="flex items-end"><button class="btn btn-primary w-full" type="submit">Thêm vào danh sách</button></div></form></section></main>
<footer class="border-t border-line py-10 text-center text-sm text-muted dark:border-line-invert dark:text-muted-invert">&copy; 2026 HRManager. Tất cả các quyền được bảo lưu.</footer><template id="record-row-template"><tr><td data-cell="id"></td><td data-cell="trader" class="font-semibold"></td><td data-cell="category"></td><td data-cell="weight"></td><td data-cell="amount"></td><td data-cell="date"></td><td data-cell="status"></td><td><button type="button" class="table-action" data-delete>Xóa</button></td></tr></template><script type="module" src="./js/records.js"></script>
</body></html>
